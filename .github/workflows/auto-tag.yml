name: Auto Tag and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/brainiac/plugins/basecamp/version.rb']

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract version
        id: version
        run: |
          VERSION=$(ruby -e "require './lib/brainiac/plugins/basecamp/version'; puts Brainiac::Plugins::Basecamp::VERSION")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - uses: ruby/setup-ruby@v1
        if: steps.check.outputs.exists == 'false'
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build gem
        if: steps.check.outputs.exists == 'false'
        run: gem build brainiac-basecamp.gemspec
      - name: Push to RubyGems
        if: steps.check.outputs.exists == 'false'
        run: gem push brainiac-basecamp-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
